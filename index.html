<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mepede.ai · Painel de Cardápio para Foodtruck</title>
  <meta name="description" content="mepede.ai - Sistema de cardapio para foodtruck">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #FF6100;
      --orange-hover: #E85700;
      --orange-subtle: #FFF1E8;
      --orange-border: #FFD2B5;
      --orange-light: #FFFAF6;
      --dark: #14171F;
      --gray-900: #1F2128;
      --gray-700: #4A5160;
      --gray-500: #6B7280;
      --gray-400: #8A91A0;
      --gray-200: #E3E6EB;
      --gray-100: #ECEEF2;
      --bg-gray: #F6F7F9;
      --green: #12A150;
      --green-light: #E8F7EE;
      --green-border: #C6EBD4;
      --red: #E5352B;
      --red-light: #FDECEB;
      --red-border: #F8C9C5;
      --amber: #B45309;
      --amber-light: #FFF4E0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg-gray);
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      color: var(--dark);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    input, textarea, select, button {
      font-family: inherit;
    }

    a { color: var(--orange); text-decoration: none; }
    a:hover { color: var(--orange-hover); }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #D9DDE3; border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: #B8BEC9; }

    /* App container */
    #app {
      display: flex;
      height: 100vh;
      min-width: 1200px;
      overflow: hidden;
      background: var(--bg-gray);
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      flex: none;
      background: #fff;
      border-right: 1px solid var(--gray-100);
      display: flex;
      flex-direction: column;
      padding: 24px 16px 16px;
      user-select: none;
      overflow-y: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px 9px 9px 3px;
      background: var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 4px 12px rgba(255, 97, 0, 0.28);
    }
    .brand-name {
      font-size: 23px;
      font-weight: 700;
      color: var(--orange);
      letter-spacing: -0.5px;
    }

    .store-status-card {
      margin-top: 24px;
      padding: 12px 14px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all .2s;
    }

    .toggle-switch {
      cursor: pointer;
      width: 42px;
      height: 24px;
      border-radius: 12px;
      position: relative;
      flex: none;
      transition: background .2s;
    }
    .toggle-knob {
      position: absolute;
      top: 2px;
      width: 20px;
      height: 20px;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.25);
      transition: left .2s;
    }

    .menu-label {
      margin: 28px 8px 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--gray-400);
      letter-spacing: 0.6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 44px;
      padding: 0 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--gray-700);
      transition: all .15s;
    }
    .nav-item:hover { background: var(--orange-subtle); color: var(--orange-hover); }
    .nav-item.active { background: var(--orange-subtle); color: var(--orange-hover); font-weight: 600; }
    .nav-badge {
      font-size: 12px;
      color: var(--gray-400);
      font-weight: 500;
    }

    .doc-banner {
      display: block;
      padding: 14px;
      border-radius: 14px;
      background: var(--bg-gray);
      border: 1px solid var(--gray-100);
      margin-bottom: 16px;
      transition: border-color .15s;
    }
    .doc-banner:hover { border-color: var(--orange-border); }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 8px 0;
      border-top: 1px solid var(--gray-100);
    }
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 18px;
      background: #FFE2CF;
      color: #C24A00;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      flex: none;
    }

    /* Main Area */
    .main-content {
      flex: 1;
      min-width: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-gray);
    }

    .top-header {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: nowrap;
      gap: 12px 16px;
      padding: 18px 32px;
      background: #fff;
      border-bottom: 1px solid var(--gray-100);
      white-space: nowrap;
    }

    .btn-link-copy {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 14px;
      border: 1px solid var(--gray-200);
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      color: #2F6FEB;
      background: #fff;
      transition: all .15s;
    }
    .btn-link-copy:hover { border-color: #2F6FEB; background: #F6F9FF; }

    .btn-dark {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 14px;
      border-radius: 10px;
      border: none;
      background: var(--dark);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-dark:hover { background: #2A2E3B; }

    .btn-whatsapp {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 14px;
      border-radius: 10px;
      border: none;
      background: var(--green);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: filter .15s;
    }
    .btn-whatsapp:hover { filter: brightness(0.92); }

    .btn-orange {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 16px;
      border-radius: 10px;
      border: none;
      background: var(--orange);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, box-shadow .15s;
    }
    .btn-orange:hover { background: var(--orange-hover); box-shadow: 0 4px 14px rgba(255, 97, 0, 0.25); }

    .btn-outline {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--gray-200);
      background: #fff;
      color: var(--dark);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-outline:hover { border-color: var(--orange); color: var(--orange-hover); background: #fff; }

    /* Scrollable body */
    .scrollable-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px 64px;
    }

    /* Cards */
    .card-box {
      background: #fff;
      border: 1px solid var(--gray-100);
      border-radius: 20px;
      padding: 20px 24px;
    }

    /* Menu Cards Row */
    .menu-cards-container {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
    }
    .menu-card {
      flex: 0 1 380px;
      min-width: 280px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px 10px 10px;
      border-radius: 14px;
      cursor: pointer;
      transition: all .15s;
      background: #FAFBFC;
      border: 1.5px solid var(--gray-100);
    }
    .menu-card.active {
      border-color: var(--dark);
      background: #fff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
    }
    .menu-card:hover { border-color: #9AA1AE; }

    .menu-thumb {
      width: 56px;
      height: 56px;
      flex: none;
      border-radius: 12px;
      overflow: hidden;
      background: #FFF1E8;
      color: var(--orange-hover);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
    }
    .menu-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Checklist */
    .checklist-bar {
      background: #fff;
      border: 1px solid var(--gray-100);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .check-step {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 14px 0 6px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
    }
    .check-step-mark {
      width: 24px;
      height: 24px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
    }

    /* Category Chips Bar */
    .chips-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 20px;
    }
    .chip {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid var(--gray-200);
      background: #fff;
      color: var(--dark);
      transition: all .15s;
    }
    .chip:hover { border-color: #B8BEC9; }
    .chip.active {
      background: var(--dark);
      color: #fff;
      border-color: var(--dark);
    }
    .chip-dot {
      width: 7px;
      height: 7px;
      border-radius: 4px;
    }
    .chip-count {
      font-size: 12px;
      opacity: 0.75;
    }
    .btn-new-cat-dashed {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 40px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1.5px dashed var(--orange-border);
      color: var(--orange-hover);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      transition: all .15s;
    }
    .btn-new-cat-dashed:hover { background: var(--orange-subtle); border-color: var(--orange); }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    .product-card {
      position: relative;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--gray-100);
      border-radius: 16px;
      padding: 12px;
      cursor: pointer;
      background: #fff;
      transition: box-shadow .15s, border-color .15s;
    }
    .product-card:hover {
      border-color: var(--orange-border);
      box-shadow: 0 8px 24px rgba(255, 97, 0, .08);
    }
    .product-media {
      position: relative;
      aspect-ratio: 4/3;
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg-gray);
    }
    .product-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .product-no-img {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #C24A00;
      background: var(--orange-subtle);
    }
    .product-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      height: 24px;
      padding: 0 10px;
      border-radius: 12px;
      background: #fff;
      color: var(--orange-hover);
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .card-add-placeholder {
      border: 1.5px dashed var(--orange-border);
      border-radius: 16px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      color: var(--orange-hover);
      background: var(--orange-light);
      transition: all .15s;
    }
    .card-add-placeholder:hover { background: var(--orange-subtle); border-color: var(--orange); }

    /* Drawer / Side panel */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 23, 31, .35);
      z-index: 100;
      backdrop-filter: blur(2px);
    }
    .drawer-content {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 620px;
      max-width: 100%;
      background: #fff;
      z-index: 101;
      display: flex;
      flex-direction: column;
      box-shadow: -16px 0 48px rgba(20, 23, 31, .16);
      animation: slideIn .2s ease-out;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    /* Client Phone Preview Section */
    .phone-preview-section {
      width: 390px;
      flex: none;
      background: #fff;
      border-left: 1px solid var(--gray-100);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0 16px;
      overflow-y: auto;
      user-select: none;
    }
    .phone-mockup {
      margin-top: 16px;
      width: 326px;
      height: 670px;
      flex: none;
      border-radius: 46px;
      background: #1C1E24;
      padding: 10px;
      box-shadow: 0 20px 50px rgba(20, 23, 31, .22);
      position: relative;
    }
    .phone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 36px;
      overflow: hidden;
      background: #fff;
    }
    .phone-island {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 96px;
      height: 24px;
      border-radius: 12px;
      background: #1C1E24;
      z-index: 40;
    }
    .phone-body-scroll {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      padding-bottom: 76px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .phone-body-scroll::-webkit-scrollbar {
      display: none;
    }
    .phone-header-cover {
      position: relative;
      height: 120px;
      background: var(--orange);
    }
    .phone-header-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .phone-store-avatar {
      width: 52px;
      height: 52px;
      border-radius: 26px;
      background: var(--orange);
      border: 3px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      margin-top: -26px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .phone-nav-bar {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      height: 58px;
      border-radius: 29px;
      background: #fff;
      box-shadow: 0 -2px 16px rgba(20, 23, 31, .12);
      display: flex;
      align-items: center;
      z-index: 35;
    }
    .phone-nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 500;
    }

    /* Toast */
    .toast-box {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--dark);
      color: #fff;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 14px;
      box-shadow: 0 12px 32px rgba(20, 23, 31, .35);
      animation: popUp .15s ease-out;
    }
    @keyframes popUp {
      from { transform: translate(-50%, 20px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    @keyframes fadeInCard {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Modal QR */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 150;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(3px);
    }
    .modal-box {
      background: #fff;
      border-radius: 20px;
      padding: 28px;
      width: 360px;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 20px 48px rgba(0,0,0,0.2);
    }

    /* Photo selection gallery */
    .preset-photos {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px 0;
      margin-top: 4px;
    }
    .preset-photo-item {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      border: 1px solid var(--gray-200);
      cursor: pointer;
      object-fit: cover;
      flex: none;
      transition: transform .15s ease, border-color .15s ease;
    }
    .preset-photo-item:hover { transform: scale(1.08); border-color: var(--orange); }

    /* Spotlight e Círculo Pulsante do Tutorial */
    /* Spotlight e Círculo Pulsante do Tutorial */
    #tutorial-spotlight {
      position: fixed;
      pointer-events: none;
      z-index: 9980;
      border-radius: 14px;
      border: 2.5px solid var(--orange);
      transition: opacity 0.15s ease;
      box-shadow: 0 0 0 4px rgba(255, 97, 0, 0.35), 0 0 0 10px rgba(255, 97, 0, 0.15), 0 0 30px rgba(255, 97, 0, 0.4);
      animation: tutPulseAura 1.8s infinite ease-in-out;
      will-change: top, left, width, height;
    }

    @keyframes tutPulseAura {
      0%, 100% {
        box-shadow: 0 0 0 3px rgba(255, 97, 0, 0.4), 0 0 0 8px rgba(255, 97, 0, 0.2), 0 0 25px rgba(255, 97, 0, 0.35);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 0 5px rgba(255, 97, 0, 0.65), 0 0 0 14px rgba(255, 97, 0, 0), 0 0 40px rgba(255, 97, 0, 0.55);
        transform: scale(1.015);
      }
    }

    .tut-beacon-pin {
      position: absolute;
      top: -38px;
      left: 50%;
      transform: translateX(-50%);
      background: #14171F;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      animation: tutBeaconBounce 1.5s infinite ease-in-out;
      pointer-events: auto;
      cursor: pointer;
      letter-spacing: 0.3px;
      user-select: none;
    }
    .tut-beacon-pin::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 5px 5px 0;
      border-style: solid;
      border-color: #14171F transparent;
      display: block;
      width: 0;
    }
    .tut-beacon-pin.below {
      top: auto;
      bottom: -38px;
    }
    .tut-beacon-pin.below::after {
      bottom: auto;
      top: -5px;
      border-width: 0 5px 5px;
      border-style: solid;
      border-color: transparent transparent #14171F;
    }

    @keyframes tutBeaconBounce {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -6px); }
    }

    .tutorial-target-highlight {
      outline: none;
    }

    /* Card do Tutorial Guiado */
    .tutorial-floating-card {
      position: fixed;
      bottom: 24px;
      z-index: 9995;
      width: 430px;
      background: #ffffff !important;
      border: 2px solid var(--orange);
      border-radius: 24px;
      box-shadow: 0 24px 64px rgba(20, 23, 31, 0.25), 0 4px 16px rgba(255, 97, 0, 0.15);
      padding: 22px;
      animation: tutCardIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1), right 0.4s cubic-bezier(0.16, 1, 0.3, 1), bottom 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .tutorial-floating-card.pos-left {
      left: 260px;
      right: auto;
    }
    .tutorial-floating-card.pos-right {
      left: auto;
      right: 410px;
    }
    @keyframes tutCardIn {
      from { opacity: 0; transform: translateY(18px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Suavização de transições gerais na página */
    .card-box, .product-card, .menu-card, .chip, .btn-orange, .btn-outline, .btn-dark, .btn-new-cat-dashed {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .product-card:hover {
      transform: translateY(-3px);
    }
    .drawer-content {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
